<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black and White App</title>
    <style>
        /* Global black and white theme */
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            filter: grayscale(100%);
        }
        h1, h2, h3, h4, h5, h6 {
            color: black;
        }
        a {
            color: black;
            text-decoration: underline;
        }
        a:hover {
            text-decoration: none;
        }
        button {
            background-color: black;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #333;
        }
        input, textarea {
            border: 1px solid black;
            background-color: white;
            color: black;
            padding: 5px;
            font-size: 1rem;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Black and White Application</h1>
        <p>Welcome to this simple black and white themed web application.</p>
        <form id="user-form">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>
            <label for="comment">Comment:</label><br>
            <textarea id="comment" name="comment" rows="4" required></textarea><br><br>
            <button type="submit">Submit</button>
        </form>
        <div id="message" style="margin-top:20px;"></div>
    </div>
    <script>
        document.getElementById('user-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const name = document.getElementById('name').value.trim();
            const comment = document.getElementById('comment').value.trim();
            if(name && comment) {
                const messageDiv = document.getElementById('message');
                messageDiv.textContent = `Thank you, ${name}. Your comment has been received.`;
                this.reset();
            }
        });
    </script>
</body>
</html>
