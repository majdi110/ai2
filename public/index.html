<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI2 Demo</title>
</head>
<body>
  <h1>AI2 Demo</h1>
  <div style="margin:1rem 0;">
  <label>Token: <input id="ai2-token" type="password" placeholder="paste ACTION_TOKEN"></label>
</div>
<div style="margin:1rem 0;">
  <input id="ai2-prompt" style="width:60%" value="Change &lt;title&gt; in public/index.html to AI2 Demo.">
  <button id="ai2-plan-btn">Plan (preview)</button>
</div>
<textarea id="ai2-events" rows="10" style="width:100%;" placeholder="SSE events appear here..."></textarea>

<h3>Recent plans</h3>
<ul id="ai2-plans"></ul>

<h3>Queued jobs</h3>
<ul id="ai2-jobs"></ul>

<script src="/ai2/static/app.ui.js"></script>

</body>
</html>
