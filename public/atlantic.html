<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlantic Serenity 🌊</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #001f3f, #003566, #0077b6);
      font-family: 'Poppins', sans-serif;
      color: #e0f2fe;
      text-align: center;
      overflow: hidden;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      color: #90e0ef;
      text-shadow: 0 0 20px rgba(144,224,239,0.7);
    }
    p {
      font-size: 1.2em;
      max-width: 600px;
      color: #caf0f8;
      opacity: 0.9;
    }
    .wave {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 200px;
      background: rgba(173, 216, 230, 0.3);
      border-radius: 50%;
      animation: wave 8s linear infinite;
    }
    .wave:nth-child(2) {
      background: rgba(173, 216, 230, 0.2);
      animation-duration: 10s;
      animation-delay: -3s;
    }
    .wave:nth-child(3) {
      background: rgba(173, 216, 230, 0.1);
      animation-duration: 12s;
      animation-delay: -5s;
    }
    @keyframes wave {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    button {
      margin-top: 40px;
      background: #00b4d8;
      color: #001f3f;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 1.1em;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #0096c7;
      color: #fff;
    }
  </style>
  <script>
    function feelAtlantic() {
      alert('🌊 Close your eyes... hear the waves, feel the calm, breathe the Atlantic.');
    }
  </script>
</head>
<body>
  <h1>Atlantic Serenity 🌊</h1>
  <p>Feel the endless rhythm of the ocean — deep, powerful, and peaceful. The Atlantic calls for calm and connection.</p>
  <button onclick="feelAtlantic()">Feel the Atlantic</button>
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
</body>
</html>
