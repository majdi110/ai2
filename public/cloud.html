<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudscape ☁️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to top, #60a5fa, #93c5fd, #e0f2fe);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: #0f172a;
      text-align: center;
    }
    h1 {
      font-size: 3em;
      color: #1e3a8a;
      text-shadow: 0 0 15px rgba(30,58,138,0.3);
      margin-bottom: 10px;
    }
    p {
      font-size: 1.2em;
      color: #1e40af;
      opacity: 0.8;
      max-width: 600px;
      margin-bottom: 30px;
    }
    .cloud {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      opacity: 0.8;
      box-shadow:
        60px 20px 60px #fff,
        120px 30px 90px #fff,
        180px 25px 60px #fff;
      animation: moveClouds 60s linear infinite;
    }
    .cloud:nth-child(3) {
      top: 20%;
      left: -300px;
      width: 200px;
      height: 80px;
      animation-duration: 50s;
      animation-delay: -10s;
    }
    .cloud:nth-child(4) {
      top: 50%;
      left: -400px;
      width: 250px;
      height: 90px;
      animation-duration: 70s;
      animation-delay: -25s;
    }
    .cloud:nth-child(5) {
      top: 70%;
      left: -500px;
      width: 180px;
      height: 70px;
      animation-duration: 80s;
      animation-delay: -40s;
    }
    @keyframes moveClouds {
      from { transform: translateX(0); }
      to { transform: translateX(200vw); }
    }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 1.1em;
      cursor: pointer;
      transition: 0.3s ease;
    }
    button:hover {
      background: #2563eb;
      box-shadow: 0 0 15px rgba(59,130,246,0.5);
    }
  </style>
  <script>
    function floatClouds() {
      alert('☁️ Just breathe and drift away... the sky has no limits.');
    }
  </script>
</head>
<body>
  <h1>Cloudscape ☁️</h1>
  <p>Soft skies and endless dreams — float free among the clouds and let your thoughts soar.</p>
  <button onclick="floatClouds()">Drift Away</button>
  <div class="cloud"></div>
  <div class="cloud"></div>
  <div class="cloud"></div>
</body>
</html>
