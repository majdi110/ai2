<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Webapp Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            height: 100vh;
            display: flex;
            background: #0a0a0a;
            color: #e0e0e0;
        }
        
        .sidebar {
            width: 400px;
            background: #151515;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header p {
            font-size: 13px;
            color: #888;
        }
        
        .prompt-area {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        textarea {
            width: 100%;
            flex: 1;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            margin-bottom: 15px;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .options {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .option-btn {
            flex: 1;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .option-btn:hover {
            border-color: #667eea;
            background: #202020;
        }
        
        .option-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }
        
        .generate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .generate-btn:hover {
            transform: translateY(-1px);
        }
        
        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
        }
        
        .tabs {
            display: flex;
            gap: 4px;
            padding: 15px 20px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .tab:hover {
            color: #e0e0e0;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .preview-area {
            flex: 1;
            position: relative;
            background: white;
            margin: 20px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .code-view {
            flex: 1;
            padding: 20px;
            overflow: auto;
            display: none;
        }
        
        .code-view.active {
            display: block;
        }
        
        .file-tree {
            background: #151515;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .file-item {
            padding: 8px 12px;
            margin: 4px 0;
            background: #1a1a1a;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .file-item:hover {
            background: #202020;
            color: #e0e0e0;
        }
        
        .file-item.selected {
            background: #667eea;
            color: white;
        }
        
        pre {
            background: #151515;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        
        .status {
            padding: 15px 20px;
            background: #151515;
            border-top: 1px solid #2a2a2a;
            font-size: 12px;
            color: #888;
        }
        
        .status.loading {
            color: #667eea;
        }
        
        .status.success {
            color: #4ade80;
        }
        
        .status.error {
            color: #f87171;
        }
        
        .loader {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #2a2a2a;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="header">
            <h1>AI Webapp Builder</h1>
            <p>Describe your app and watch it come to life</p>
        </div>
        
        <div class="prompt-area">
            <textarea id="prompt" placeholder="Example: Create a todo app with dark mode, drag and drop, and local storage...">Create a beautiful landing page for a SaaS product with:
- Hero section with gradient background
- Feature cards with icons
- Pricing table with 3 tiers
- Contact form
- Responsive design</textarea>
            
            <div class="options">
                <button class="option-btn active" data-framework="react">React</button>
                <button class="option-btn" data-framework="html">HTML</button>
                <button class="option-btn" data-framework="vue">Vue</button>
            </div>
            
            <button class="generate-btn" id="generateBtn">Generate App</button>
        </div>
    </div>
    
    <div class="main-content">
        <div class="tabs">
            <button class="tab active" data-tab="preview">Preview</button>
            <button class="tab" data-tab="code">Code</button>
            <button class="tab" data-tab="files">Files</button>
        </div>
        
        <div class="preview-area" id="previewArea">
            <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #888; font-size: 14px;">
                Generate an app to see preview
            </div>
        </div>
        
        <div class="code-view" id="codeView">
            <div class="file-tree" id="fileTree"></div>
            <pre id="codeContent"><code>// Select a file to view code</code></pre>
        </div>
        
        <div class="status" id="status">
            Ready to build
        </div>
    </div>

    <script>
        const API_BASE = '$api';
        const API_TOKEN = '$TOKEN'; // Replace with actual token
        
        let currentFramework = 'react';
        let generatedFiles = {};
        
        // Framework selection
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFramework = btn.dataset.framework;
            });
        });
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                const tabName = tab.dataset.tab;
                document.getElementById('previewArea').style.display = tabName === 'preview' ? 'block' : 'none';
                document.getElementById('codeView').style.display = tabName === 'code' || tabName === 'files' ? 'block' : 'none';
            });
        });
        
        // Generate button
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const prompt = document.getElementById('prompt').value;
            const btn = document.getElementById('generateBtn');
            const status = document.getElementById('status');
            
            if (!prompt.trim()) return;
            
            btn.disabled = true;
            status.className = 'status loading';
            status.innerHTML = '<span class="loader"></span>Generating your app...';
            
            try {
                // Call your /plan endpoint
                const response = await fetch(`${API_BASE}/plan`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_TOKEN}`,
                        'X-Idempotency-Key': `webapp-${Date.now()}`
                    },
                    body: JSON.stringify({
                        prompt: `${prompt}\n\nFramework: ${currentFramework}\nCreate a complete, working application.`,
                        preview_only: false,
                        return_combined_diff: true
                    })
                });
                
                const result = await response.json();
                
                if (result.ok && result.plan) {
                    status.className = 'status success';
                    status.textContent = `✓ Generated ${result.plan.steps.length} files successfully`;
                    
                    // Parse generated files from plan
                    parseGeneratedFiles(result.plan);
                    
                    // Show preview (simplified - would need actual build)
                    showPreview();
                } else {
                    throw new Error(result.error || 'Generation failed');
                }
            } catch (error) {
                status.className = 'status error';
                status.textContent = `✗ Error: ${error.message}`;
            } finally {
                btn.disabled = false;
            }
        });
        
        function parseGeneratedFiles(plan) {
            generatedFiles = {};
            
            plan.steps.forEach(step => {
                if (step.type === 'patch' && step.diff) {
                    // Parse diff to extract file content (simplified)
                    const matches = step.diff.match(/diff --git a\/(.+?) b\/(.+?)\n[\s\S]+?\n\+\+\+ b\/.+?\n([\s\S]+?)(?=diff --git|$)/g);
                    if (matches) {
                        matches.forEach(match => {
                            const fileMatch = match.match(/b\/(.+?)\n/);
                            if (fileMatch) {
                                const filename = fileMatch[1];
                                generatedFiles[filename] = match;
                            }
                        });
                    }
                }
            });
            
            updateFileTree();
        }
        
        function updateFileTree() {
            const fileTree = document.getElementById('fileTree');
            fileTree.innerHTML = '<h3 style="margin-bottom: 10px; color: #e0e0e0; font-size: 14px;">Generated Files</h3>';
            
            Object.keys(generatedFiles).forEach(filename => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.textContent = filename;
                fileItem.addEventListener('click', () => showFileContent(filename));
                fileTree.appendChild(fileItem);
            });
        }
        
        function showFileContent(filename) {
            document.querySelectorAll('.file-item').forEach(item => {
                item.classList.toggle('selected', item.textContent === filename);
            });
            
            const codeContent = document.getElementById('codeContent');
            codeContent.innerHTML = `<code>${escapeHtml(generatedFiles[filename])}</code>`;
        }
        
        function showPreview() {
            const previewArea = document.getElementById('previewArea');
            previewArea.innerHTML = '<div style="padding: 40px; text-align: center; color: #888;">Preview will appear here after build process completes.<br><br>In production, this would show a live iframe of your app.</div>';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
