<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Dashboard</title>
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #38bdf8;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 30px;
      width: 300px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    .label {
      font-weight: 600;
      color: #94a3b8;
    }
    .value {
      font-size: 1.4em;
      margin-top: 8px;
      color: #f8fafc;
    }
  </style>
  <script>
    function updateStats() {
      document.getElementById('cpu').textContent = (Math.random() * 100).toFixed(1) + '%';
      document.getElementById('memory').textContent = (Math.random() * 16).toFixed(2) + ' GB';
      document.getElementById('uptime').textContent = (Math.random() * 72).toFixed(1) + ' hrs';
    }
    setInterval(updateStats, 2000);
    window.onload = updateStats;
  </script>
</head>
<body>
  <h1>System Dashboard (Screen View)</h1>
  <div class="card"><span class="label">CPU Load</span><div class="value" id="cpu">--%</div></div>
  <div class="card"><span class="label">Memory Usage</span><div class="value" id="memory">-- GB</div></div>
  <div class="card"><span class="label">Uptime</span><div class="value" id="uptime">-- hrs</div></div>
</body>
</html>
