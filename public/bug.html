<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oops! There’s a Bug 🐞</title>
  <style>
    body {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #f8fafc;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    h1 {
      font-size: 3em;
      color: #f87171;
      text-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
    }
    p {
      font-size: 1.2em;
      color: #e2e8f0;
      max-width: 500px;
    }
    .bug {
      position: absolute;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle at center, #f87171 30%, #7f1d1d 90%);
      border-radius: 50%;
      animation: crawl 10s linear infinite;
    }
    .bug::before, .bug::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 60px;
      background: #fef2f2;
      border-radius: 10px;
      top: 10px;
    }
    .bug::before { left: -15px; transform: rotate(45deg); }
    .bug::after { right: -15px; transform: rotate(-45deg); }
    @keyframes crawl {
      0% { top: 80%; left: -10%; transform: rotate(0deg); }
      50% { top: 40%; left: 60%; transform: rotate(180deg); }
      100% { top: 80%; left: 110%; transform: rotate(360deg); }
    }
    button {
      margin-top: 40px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1.1em;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #0ea5e9;
    }
  </style>
  <script>
    function fixBug() {
      alert('🧑‍💻 Bug fixed! (Just kidding... it’ll be back in production)');
    }
  </script>
</head>
<body>
  <div class="bug"></div>
  <h1>Oops! There’s a Bug 🐞</h1>
  <p>Don’t panic! Every coder’s greatest enemy has appeared. Time to grab your debugger and some coffee.</p>
  <button onclick="fixBug()">Fix the Bug</button>
</body>
</html>
