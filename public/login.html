<!-- public/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI2 • Sign In</title>
<style>
:root{--bg:#0b0b10;--panel:#15151f;--muted:#96a0ad;--text:#e9ecf2;--br:#25263a;--pri:#7c5cff;--pri2:#6aa4ff;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,Segoe UI,Roboto,Ubuntu,sans-serif;display:grid;place-items:center;min-height:100vh}
.card{width:min(720px,92vw);background:var(--panel);border:1px solid var(--br);border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
h1{margin:0 0 4px;font-size:22px}
p.muted{color:var(--muted);margin:0 0 14px}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
label{font-size:12px;color:var(--muted);display:block;margin:8px 0 6px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--br);background:#0f0f16;color:var(--text)}
.row{display:flex;gap:10px;align-items:center}
button{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.ok{color:#22c55e}.err{color:#ef4444}
</style>
</head>
<body>
<div class="card">
<h1>🚀 AI2 Builder — Sign In</h1>
<p class="muted">Connect to your AI2 gateway and choose a user.</p>


<div class="grid">
<div>
<label>API Endpoint</label>
<input id="apiBase" type="url" placeholder="https://datav.belocloud.com/ai2" />
</div>
<div>
<label>API Token (Bearer)</label>
<input id="apiToken" type="password" placeholder="tok_…" />
</div>
<div>
<label>Dry-run Key</label>
<input id="dryrunKey" type="password" placeholder="X-Dryrun-Key" />
</div>
<div>
<label>Base Branch</label>
<input id="baseBranch" value="public" />
</div>
</div>


<div class="grid" style="margin-top:10px">
<div>
<label>Username (userId)</label>
<input id="userId" placeholder="u1" />
</div>
<div>
<label>Password</label>
<input id="password" type="password" placeholder="••••••••" />
</div>
<div>
<label>Name</label>
<input id="name" placeholder="Your name" />
</div>
<div>
<label>Email</label>
</html>
