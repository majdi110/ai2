    <h1>Inventory Management</h1>
    <form id="addItemForm">
        <input type="text" id="itemName" placeholder="Item Name" required minlength="1" autocomplete="off" />

    <script>
        // Utility to save/load inventory to/from localStorage
        const STORAGE_KEY = 'inventoryItems';

        function saveItems(items) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        }

        function loadItems() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (!stored) return [];
            try {
                return JSON.parse(stored);
            } catch (e) {
                console.error('Failed to parse stored inventory items', e);
                return [];
            }
        }

        function renderItems() {
            const itemsList = document.getElementById('itemsList');
            const emptyMessage = document.getElementById('emptyMessage');
            itemsList.innerHTML = '';
            const items = loadItems();
            if (items.length === 0) {
                emptyMessage.style.display = 'block';
                return;
            } else {
                emptyMessage.style.display = 'none';
            }
            items.forEach((item, idx) => {
                const li = document.createElement('li');
                li.dataset.index = idx;
                const infoDiv = document.createElement('div');
                infoDiv.className = 'item-info';
                infoDiv.textContent = `${item.name} (Quantity: ${item.quantity})`;
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = 'Delete';
                delBtn.addEventListener('click', () => {
                    deleteItem(idx);
                });
                li.appendChild(infoDiv);
                li.appendChild(delBtn);
                itemsList.appendChild(li);
            });
        }

        function addItem(name, quantity) {
            const items = loadItems();
            // If item exists, update quantity
            const index = items.findIndex(i => i.name.toLowerCase() === name.toLowerCase());
            if (index !== -1) {
                items[index].quantity += quantity;
            } else {
                items.push({name, quantity});
            }
            saveItems(items);
            renderItems();
        }

        function deleteItem(index) {
            const items = loadItems();
            if (index >= 0 && index < items.length) {
                items.splice(index, 1);
                saveItems(items);
                renderItems();
            }
        }

        document.getElementById('addItemForm').addEventListener('submit', event => {
            event.preventDefault();
            const nameInput = document.getElementById('itemName');
            const quantityInput = document.getElementById('itemQuantity');
            const name = nameInput.value.trim();
            const quantity = parseInt(quantityInput.value, 10);
            if (name && !isNaN(quantity) && quantity > 0) {
                addItem(name, quantity);
                nameInput.value = '';
                quantityInput.value = '';
                nameInput.focus();
            }
        });

        // Initial render
        renderItems();
