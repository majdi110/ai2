<!doctype html>
<meta charset="utf-8">
<title>AI2 Planner</title>
<style>
body{font:16px/1.5 system-ui;margin:2rem;max-width:900px}
textarea{width:100%;height:8em}
pre{background:#f7f7f7;border:1px solid #ccc;padding:1em;white-space:pre-wrap}
</style>
<h1>AI2 Planner</h1>
<form id="f">
  <label>Prompt:</label><br>
  <textarea id="prompt" placeholder="e.g. Create a webapp for inventory management (Node backend, React frontend)"></textarea><br>
  <button>Submit</button>
</form>
<pre id="out"></pre>
<script>
document.getElementById('f').addEventListener('submit',async(e)=>{
 e.preventDefault();
 const p=document.getElementById('prompt').value.trim();
 const out=document.getElementById('out');
 out.textContent='Sending...';
 try{
  const r=await fetch('/ai2/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});
  const j=await r.json();
  out.textContent=JSON.stringify(j,null,2);
 }catch(err){out.textContent='Error: '+err;}
});
</script>
